#cloud-config
# Guided Ubuntu Desktop 24.04 LTS installation with workstation provisioning.
# Keep disk, encryption, account, and other interactive installer choices.
# No disk layout, username, password, or private key is stored here.
# Generated by installer/render_autoinstall.py; update the generator/manifests.
autoinstall:
  version: 1
  interactive-sections:
    - '*'
  packages:
    - bash-completion
    - bat
    - btop
    - ca-certificates
    - cloc
    - curl
    - dconf-cli
    - fonts-firacode
    - fonts-jetbrains-mono
    - git
    - git-lfs
    - gnome-shell-extension-manager
    - gnome-terminal
    - htop
    - jq
    - libnotify-bin
    - lsof
    - ncdu
    - net-tools
    - pavucontrol
    - psmisc
    - python3
    - python3-gi
    - tmux
    - tree
    - unzip
    - wget
    - zip
  late-commands:
    - ["curtin", "in-target", "--target=/target", "--", "env", "GIT_TERMINAL_PROMPT=0", "sh", "-c", "umask 022; exec \"$@\"", "workstation-fetch", "git", "clone", "--no-checkout", "--single-branch", "https://github.com/jamwujustyle/workstation-setup.git", "/opt/workstation-setup"]
    - ["curtin", "in-target", "--target=/target", "--", "env", "GIT_TERMINAL_PROMPT=0", "sh", "-c", "umask 022; exec \"$@\"", "workstation-fetch", "git", "-C", "/opt/workstation-setup", "checkout", "--detach", "801ef4a1edfc31e0dc774a7599539a1af80aff44"]
    - ["curtin", "in-target", "--target=/target", "--", "env", "GIT_TERMINAL_PROMPT=0", "sh", "-c", "umask 022; exec \"$@\"", "workstation-fetch", "git", "clone", "--no-checkout", "--single-branch", "https://github.com/jamwujustyle/agent-playbook.git", "/opt/agent-playbook"]
    - ["curtin", "in-target", "--target=/target", "--", "env", "GIT_TERMINAL_PROMPT=0", "sh", "-c", "umask 022; exec \"$@\"", "workstation-fetch", "git", "-C", "/opt/agent-playbook", "checkout", "--detach", "3233f76cc0d2741d2536b883a00a636fc06beb40"]
    - ["curtin", "in-target", "--target=/target", "--", "/usr/bin/python3", "/opt/workstation-setup/installer/stage.py", "--apply"]
